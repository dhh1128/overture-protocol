[project]
name = "overture"
version = "0.1.0.dev0"
description = "Reference package and stand-in agent for the Overture Protocol, built on keripy."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Hardman" }]
dependencies = [
    # keripy's main branch, pinned by commit: the PyPI releases predate v2 exn (this.i 3wj8v5dl).
    "keri @ git+https://github.com/WebOfTrust/keripy@0f1966f8809df30cb292774e7d04f365742e9328",
    "jsonschema>=4.26",
    "falcon>=4.3",
]

[project.scripts]
overture-standin = "overture.standin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/overture"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "overture/data/schemas"
"catalog" = "overture/data/catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=overture --cov-branch --cov-report=term-missing --cov-fail-under=100"
