name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libsodium (keripy's signing library)
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Python 3.14 and dependencies
        run: uv sync --python 3.14 --locked
      - name: Run tests at 100% branch coverage
        run: uv run pytest
